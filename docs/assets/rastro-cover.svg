  <title id="title">Rastro — Cada solicitação, um próximo passo.</title>
  <desc id="description">Sistema para acompanhar pedidos, responsabilidades e soluções. Do registro à confirmação.</desc>
  <rect width="1200" height="380" rx="22" fill="#eef2eb"/>
  <path d="M800 0h400v380H800z" fill="#e1eade"/>
