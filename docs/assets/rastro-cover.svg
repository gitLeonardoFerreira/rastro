  <text x="64" y="295" fill="#788871" font-family="Arial,Helvetica,sans-serif" font-size="19">Pedidos, responsabilidades e soluções em um só lugar.</text>
  <text x="848" y="73" fill="#548346" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="2">DO PEDIDO À SOLUÇÃO</text>
